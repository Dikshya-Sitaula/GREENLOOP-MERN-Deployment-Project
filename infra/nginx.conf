server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Up to 5 photos x 5 MB per listing (multer limits) plus form overhead
    client_max_body_size 27M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite build output (deploy.yml syncs it here)
    root /var/www/greenloop/frontend/dist;
    index index.html;

    # REST API -> Express (PM2) on localhost only; port 5000 is not exposed publicly
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User-uploaded listing photos: served by Express (express.static on backend/uploads), so file
    # permissions on disk never matter to Nginx. ^~ stops other location rules from intercepting.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite assets are immutable
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router (BrowserRouter) fallback so refreshing /explore, /dashboard, ... works
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
